name: Codefather verification

on:
  push:
    branches: ['ci/verify-codefather']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 读取独立验证脚本
        uses: actions/checkout@v4
      - name: 保留烟测入口
        run: cp scripts/verify-codefather.cjs "$RUNNER_TEMP/verify-codefather.cjs"
      - name: 检出实际 PR 分支
        uses: actions/checkout@v4
        with:
          ref: feat/codefather-adapter
      - name: 记录实际验证提交并恢复隔离脚本
        id: source
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/codefather-source-sha.txt"
          mkdir -p scripts
          cp "$RUNNER_TEMP/verify-codefather.cjs" scripts/verify-codefather.cjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 核心单元测试（单 worker）
        run: pnpm --filter @wechatsync/core exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism
      - name: 核心类型检查
        run: pnpm --filter @wechatsync/core typecheck
      - name: 构建核心
        run: pnpm --filter @wechatsync/core build
      - name: 构建扩展
        run: pnpm --filter @wechatsync/extension build
      - name: 安装隔离的烟测浏览器
        run: |
          npm install --prefix "$RUNNER_TEMP/codefather-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/codefather-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: 验证真实编辑器恢复本地草稿（不发布）
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/codefather-browser/node_modules/playwright
        run: node scripts/verify-codefather.cjs
      - name: 保存验证提交与烟测证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codefather-browser-evidence
          path: |
            codefather-smoke-output/
            ${{ runner.temp }}/codefather-source-sha.txt
          if-no-files-found: ignore
